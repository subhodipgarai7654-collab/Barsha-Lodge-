<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Sacred Kalash / Trishul / Temple Arch Emblem -->
  <g transform="translate(256, 210)" filter="url(#shadow)">
    <!-- Aura Ring -->
    <circle r="120" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,6" opacity="0.6" />
    <circle r="98" fill="#1c1917" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Trishul / Temple Crown -->
    <path d="M0 -78 L0 60" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <path d="M-40 -40 C-36 -10, -18 10, 0 16 C18 10, 36 -10, 40 -40" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
    <path d="M-44 -44 L-40 -34 L-34 -42 Z" fill="url(#goldGrad)" />
    <path d="M44 -44 L40 -34 L34 -42 Z" fill="url(#goldGrad)" />
    <path d="M0 -86 L-10 -72 L10 -72 Z" fill="url(#goldGrad)" />

    <!-- Red Sacred Tilak / Bindi -->
    <ellipse cx="0" cy="-10" rx="9" ry="15" fill="url(#redGrad)" stroke="#fef08a" stroke-width="1.5" />
    <circle cx="0" cy="18" r="5" fill="#fef08a" />
  </g>

  <!-- Lodge Title Typography -->
  <text x="256" y="375" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="44" font-weight="800" fill="url(#goldGrad)" letter-spacing="4">
    BARSHA LODGE
  </text>
  <text x="256" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#e7e5e4" letter-spacing="6">
    TARAPITH
  </text>
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#a8a29e" letter-spacing="2">
    MAA TARA TEMPLE • COMFORT STAY
  </text>
</svg>
