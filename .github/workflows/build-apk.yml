name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Task Earn Pro APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create signing keystore
        shell: bash
        run: |
          set -e

          PASSWORD="TaskEarnPro@2026"

          keytool -genkeypair \
            -keystore android.keystore \
            -storepass "$PASSWORD" \
            -keypass "$PASSWORD" \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Task Earn Pro, OU=Task Earn Pro, O=Task Earn Pro, C=IN"

          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Configure signing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "twa-manifest.json";
          const manifest = JSON.parse(fs.readFileSync(file, "utf8"));

          manifest.signingKey = {
            path: "./android.keystore",
            alias: "android"
          };

          fs.writeFileSync(
            file,
            JSON.stringify(manifest, null, 2) + "\n"
          );
          NODE

      - name: Generate Android project
        run: |
          npx @bubblewrap/cli update --manifest=twa-manifest.json

      - name: Build signed APK
        run: |
          npx @bubblewrap/cli build --manifest=twa-manifest.json

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app-release-signed.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Signed APK was not created."
            find . -name "*.apk" -print
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p output-apk

          cp "$APK" \
            output-apk/TaskEarnPro-v1.0.0.apk

          echo "Signed APK created successfully:"
          ls -lh output-apk/TaskEarn
